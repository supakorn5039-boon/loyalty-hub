name: LoyaltyHub CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # 1. Backend CI Job (Golang)
  backend-ci:
    name: Backend CI (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: backend/go.sum

      - name: Install Dependencies
        run: |
          cd backend
          go mod download

      - name: Verify Go Formatting
        run: |
          cd backend
          diff -u <(echo -n) <(gofmt -d .)

      - name: Build Go Binary
        run: |
          cd backend
          go build -v -o loyaltyhub-api .

  # 2. Frontend CI Job (React + Vite + TypeScript)
  frontend-ci:
    name: Frontend CI (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install NPM Dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Check & Vite Production Build
        run: |
          cd frontend
          npm run build

  # 3. Docker Compose Verification Job
  docker-build:
    name: Docker Build Verification
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Compose Build
        run: |
          docker compose config
